# https://goreleaser.com
version: 2
project_name: agent-asearch
builds:
  - id: asearch
    main: .
    dir: cmd/asearch
    binary: asearch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
archives:
  - formats: ['tar.gz']
    name_template: "asearch_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.en.md
      - AGENT_INSTRUCTIONS.md
      - LICENSE
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
